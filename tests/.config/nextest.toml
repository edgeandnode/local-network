# Tests share one blockchain, so state-mutating tests run in serial groups
# (max-threads = 1). Nextest runs each test as its own process, so #[serial]
# in-process locking wouldn't serialize across them.

# Kill any test still running after 20 minutes (20 x 60s periods). Without
# this, a test stuck polling a wedged stack runs until the CI job's own
# timeout cancels it, and a cancelled job skips the failure-diagnostics steps.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 20 }

# JUnit XML (target/nextest/default/junit.xml) feeds the CI test report so
# every test shows up individually in the PR checks instead of one green tick.
[profile.default.junit]
path = "junit.xml"

# The DIPs agreement-events probe runs as its own non-blocking CI step and check
# run, so it gets its own profile and JUnit at target/nextest/events/junit.xml.
[profile.events.junit]
path = "junit.xml"

[test-groups.alloc]
max-threads = 1

[test-groups.reo]
max-threads = 1

[test-groups.staking]
max-threads = 1

# alloc group: allocation lifecycle, reward collection, eligibility,
# subgraph denial, rewards conditions (except revert-only tests), and DIPs
[[profile.default.overrides]]
filter = """binary(~allocation_lifecycle) \
  | binary(~reward_collection) \
  | binary(~eligibility) \
  | binary(~subgraph_denial) \
  | binary(~dips_lifecycle) \
  | binary(~dips_events) \
  | (binary(~rewards_conditions) - test(=reclaim_unauthorized_reverts))"""
test-group = "alloc"

# reo group: REO governance config mutations (not reads/reverts)
[[profile.default.overrides]]
filter = """test(=contract_not_paused) \
  | test(=renew_single_indexer) \
  | test(=batch_renewal) \
  | test(=zero_address_skipped) \
  | test(=oracle_renewal_resets_timeout) \
  | test(=enable_validation_eligible_stays) \
  | test(=eligibility_expires_after_period) \
  | test(=timeout_failopen) \
  | test(=pause_blocks_writes) \
  | test(=disable_validation_emergency) \
  | test(=rewards_view_zero_for_ineligible)"""
test-group = "reo"

# staking group: stake and provision management
[[profile.default.overrides]]
filter = "binary(~stake_management) | binary(~provision_management)"
test-group = "staking"
