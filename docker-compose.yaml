# Recipe-resolution sentinel. `LOCAL_NETWORK_RECIPE` is emitted into .env by
# scripts/resolve-recipe.sh; if .env is absent or hand-edited without it, this
# substitution halts compose with a clear pointer to `just resolve`.
x-recipe-sentinel: ${LOCAL_NETWORK_RECIPE:?Run "just resolve" (or "just up [recipe]") first to generate .env from a recipe in recipes/}

services:
  chain:
    container_name: chain
    build: { context: containers/core/chain }
    ports: ["${CHAIN_RPC_PORT}:8545"]
    volumes:
      - chain-data:/data
    healthcheck: { interval: 1s, retries: 10, test: cast block }
    stop_grace_period: 30s
    restart: on-failure:3
    environment:
      - FORK_RPC_URL=${FORK_RPC_URL:-}
    networks: [default, cross-stack]

  block-explorer:
    container_name: block-explorer
    profiles: [explorer]
    build: { context: containers/ui/block-explorer, args: { RPC_URL: http://localhost:8545 } }
    depends_on:
      chain: { condition: service_healthy }
    ports: ["${BLOCK_EXPLORER_PORT}:3000"]

  ipfs:
    container_name: ipfs
    image: ipfs/kubo:v0.38.2
    ports: ["${IPFS_RPC_PORT}:5001"]
    volumes:
      - ipfs-data:/data/ipfs
    environment:
      IPFS_PROFILE: lowpower
      IPFS_SWARM_KEY: ""
      LIBP2P_FORCE_PNET: ""
    entrypoint: /bin/sh
    command:
      - -c
      - |
        ipfs init --profile=lowpower 2>/dev/null || true
        ipfs config Addresses.Swarm --json '[]'
        ipfs config --json Bootstrap '[]'
        ipfs config Routing.Type none
        ipfs config --json Swarm.DisableNatPortMap true
        ipfs config --json Swarm.RelayClient.Enabled false
        ipfs config --json Swarm.RelayService.Enabled false
        ipfs config --json Swarm.Transports.Network.Relay false
        ipfs config --json Discovery.MDNS.Enabled false
        ipfs config Addresses.API /ip4/0.0.0.0/tcp/5001
        ipfs config Addresses.Gateway /ip4/0.0.0.0/tcp/8080
        ipfs daemon
    healthcheck: { interval: 1s, retries: 50, test: ipfs id }
    restart: on-failure:3
    networks: [default, cross-stack]

  postgres:
    container_name: postgres
    image: postgres:17-alpine
    ports: ["${POSTGRES_PORT}:5432"]
    command: postgres -c 'max_connections=1000' -c 'shared_preload_libraries=pg_stat_statements'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./containers/core/postgres/setup.sql:/docker-entrypoint-initdb.d/setup.sql:ro
    environment:
      POSTGRES_INITDB_ARGS: "--encoding UTF8 --locale=C"
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: postgres
    healthcheck: { interval: 1s, retries: 20, test: pg_isready -U postgres }
    restart: on-failure:3

  graph-node:
    container_name: graph-node
    build:
      context: containers/indexer/graph-node
      args:
        GRAPH_NODE_VERSION: ${GRAPH_NODE_VERSION}
    depends_on:
      chain: { condition: service_healthy }
      ipfs: { condition: service_healthy }
      postgres: { condition: service_healthy }
    stop_signal: SIGKILL
    ports:
      - ${GRAPH_NODE_GRAPHQL_PORT}:8000
      - ${GRAPH_NODE_ADMIN_PORT}:8020
      - ${GRAPH_NODE_STATUS_PORT}:8030
      - ${GRAPH_NODE_METRICS_PORT}:8040
    volumes:
      - ./shared:/opt/shared:ro
      - ./.env:/opt/config/.env:ro
      - config-local:/opt/config:ro
    healthcheck:
      { interval: 1s, retries: 20, test: curl -f http://127.0.0.1:8030 }
    restart: on-failure:3

  graph-contracts:
    container_name: graph-contracts
    build:
      context: containers/core/graph-contracts
      args:
        CONTRACTS_VERSION: ${CONTRACTS_VERSION}
    depends_on:
      chain: { condition: service_healthy }
    volumes:
      - ./shared:/opt/shared:ro
      - ./.env:/opt/config/.env:ro
      - config-local:/opt/config
    environment:
      - FORK_RPC_URL=${FORK_RPC_URL:-}

  block-oracle:
    container_name: block-oracle
    profiles: [block-oracle, indexing-payments]
    build:
      context: containers/oracles/block-oracle
      args:
        BLOCK_ORACLE_COMMIT: ${BLOCK_ORACLE_COMMIT}
    depends_on:
      graph-contracts: { condition: service_completed_successfully }
    stop_signal: SIGKILL
    volumes:
      - ./shared:/opt/shared:ro
      - ./.env:/opt/config/.env:ro
      - config-local:/opt/config:ro
    environment:
      RUST_BACKTRACE: full
    healthcheck:
      {
        interval: 1s,
        retries: 600,
        test: curl -f http://127.0.0.1:9090/metrics,
      }
    restart: on-failure:3

  indexer-agent:
    container_name: indexer-agent
    build:
      context: containers/indexer/indexer-agent
      args:
        INDEXER_AGENT_VERSION: ${INDEXER_AGENT_VERSION}
    platform: linux/amd64
    depends_on:
      graph-contracts: { condition: service_completed_successfully }
      subgraph-deploy: { condition: service_completed_successfully }
    ports: ["${INDEXER_MANAGEMENT_PORT}:7600"]
    stop_signal: SIGKILL
    volumes:
      - ./shared:/opt/shared:ro
      - ./.env:/opt/config/.env:ro
      - config-local:/opt/config:ro
    healthcheck:
      { interval: 10s, retries: 600, test: curl -f http://127.0.0.1:7600/ }
    restart: on-failure:3

  subgraph-deploy:
    container_name: subgraph-deploy
    build:
      context: containers/core/subgraph-deploy
      args:
        NETWORK_SUBGRAPH_COMMIT: ${NETWORK_SUBGRAPH_COMMIT}
        BLOCK_ORACLE_COMMIT: ${BLOCK_ORACLE_COMMIT}
        INDEXING_PAYMENTS_SUBGRAPH_VERSION: ${INDEXING_PAYMENTS_SUBGRAPH_VERSION}
    depends_on:
      graph-contracts: { condition: service_completed_successfully }
      graph-node: { condition: service_healthy }
    volumes:
      - ./shared:/opt/shared:ro
      - ./.env:/opt/config/.env:ro
      - config-local:/opt/config:ro

  start-indexing:
    container_name: start-indexing
    build: { context: containers/indexer/start-indexing }
    depends_on:
      subgraph-deploy: { condition: service_completed_successfully }
      indexer-agent: { condition: service_healthy }
    volumes:
      - ./shared:/opt/shared:ro
      - ./.env:/opt/config/.env:ro
      - config-local:/opt/config:ro

  redpanda:
    container_name: redpanda
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.5
    user: root
    ports:
      - ${REDPANDA_KAFKA_EXTERNAL_PORT}:29092
      - ${REDPANDA_ADMIN_PORT}:9644
      - ${REDPANDA_PANDAPROXY_PORT}:8082
      - ${REDPANDA_SCHEMA_REGISTRY_PORT}:8081
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --mode dev-container
      - --default-log-level=info
      - --kafka-addr=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      - --advertise-kafka-addr=INTERNAL://redpanda:9092,EXTERNAL://localhost:29092
      - --pandaproxy-addr 0.0.0.0:8082
      - --schema-registry-addr 0.0.0.0:8081
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      {
        interval: 1s,
        retries: 600,
        test: rpk topic list --brokers="localhost:9092",
      }
    restart: on-failure:3

  graph-tally-aggregator:
    container_name: graph-tally-aggregator
    build:
      context: containers/query-payments/graph-tally-aggregator
      args:
        GRAPH_TALLY_AGGREGATOR_VERSION: ${GRAPH_TALLY_AGGREGATOR_VERSION}
    depends_on:
      graph-contracts: { condition: service_completed_successfully }
    ports: ["${GRAPH_TALLY_AGGREGATOR_PORT}:7610"]
    stop_signal: SIGKILL
    volumes:
      - ./shared:/opt/shared:ro
      - ./.env:/opt/config/.env:ro
      - config-local:/opt/config:ro
    environment:
      RUST_LOG: info,graph_tally_aggregator=trace
      RUST_BACKTRACE: 1
    restart: on-failure:3

  graph-tally-escrow-manager:
    container_name: graph-tally-escrow-manager
    build:
      context: containers/query-payments/graph-tally-escrow-manager
      args:
        GRAPH_TALLY_ESCROW_MANAGER_VERSION: ${GRAPH_TALLY_ESCROW_MANAGER_VERSION}
    depends_on:
      subgraph-deploy: { condition: service_completed_successfully }
      redpanda: { condition: service_healthy }
    stop_signal: SIGKILL
    volumes:
      - ./shared:/opt/shared:ro
      - ./.env:/opt/config/.env:ro
      - config-local:/opt/config:ro
    environment:
      RUST_LOG: info,graph_tally_escrow_manager=trace
      RUST_BACKTRACE: 1
    restart: on-failure:3

  gateway:
    container_name: gateway
    build:
      context: containers/core/gateway
      args:
        GATEWAY_VERSION: ${GATEWAY_VERSION}
    depends_on:
      indexer-service: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    ports: ["${GATEWAY_PORT}:7700"]
    stop_signal: SIGKILL
    volumes:
      - ./shared:/opt/shared:ro
      - ./.env:/opt/config/.env:ro
      - config-local:/opt/config:ro
    environment:
      RUST_LOG: info,graph_gateway=trace
      RUST_BACKTRACE: 1
    restart: on-failure:3
    healthcheck:
      { interval: 1s, retries: 100, test: curl -f http://127.0.0.1:7700/ }

  indexer-service:
    container_name: indexer-service
    build:
      context: containers/indexer/indexer-service
      args:
        INDEXER_SERVICE_RS_VERSION: ${INDEXER_SERVICE_RS_VERSION}
    depends_on:
      indexer-agent: { condition: service_healthy }
      subgraph-deploy: { condition: service_completed_successfully }
    ports:
      - "${INDEXER_SERVICE_PORT}:7601"
      - "${INDEXER_SERVICE_DIPS_PORT}:${INDEXER_SERVICE_DIPS_PORT}"
    stop_signal: SIGKILL
    volumes:
      - ./shared:/opt/shared:ro
      - ./.env:/opt/config/.env:ro
      - config-local:/opt/config:ro
    environment:
      RUST_LOG: info,indexer_service_rs=trace
      RUST_BACKTRACE: 1
    healthcheck:
      { interval: 1s, retries: 100, test: curl -f http://127.0.0.1:7601/ }
    restart: on-failure:3

  tap-agent:
    container_name: tap-agent
    build:
      context: containers/query-payments/tap-agent
      args:
        INDEXER_TAP_AGENT_VERSION: ${INDEXER_TAP_AGENT_VERSION}
    depends_on:
      indexer-agent: { condition: service_healthy }
      subgraph-deploy: { condition: service_completed_successfully }
    stop_signal: SIGKILL
    volumes:
      - ./shared:/opt/shared:ro
      - ./.env:/opt/config/.env:ro
      - config-local:/opt/config:ro
    environment:
      RUST_LOG: info,indexer_tap_agent=trace
      RUST_BACKTRACE: 1
    restart: on-failure:3

  # --- Profiled components (activated via COMPOSE_PROFILES in .env) ---

  eligibility-oracle-node:
    container_name: eligibility-oracle-node
    profiles: [rewards-eligibility]
    build:
      context: containers/oracles/eligibility-oracle-node
      args:
        ELIGIBILITY_ORACLE_NODE_VERSION: ${ELIGIBILITY_ORACLE_NODE_VERSION}
    depends_on:
      redpanda: { condition: service_healthy }
      gateway: { condition: service_healthy }
    volumes:
      - ./shared:/opt/shared:ro
      - ./.env:/opt/config/.env:ro
      - config-local:/opt/config:ro
    environment:
      RUST_LOG: eligibility_oracle=debug
      BLOCKCHAIN_PRIVATE_KEY: ${DEPLOYER_SECRET}
    restart: on-failure:3

  iisa-scoring:
    container_name: iisa-scoring
    profiles: [indexing-payments]
    build:
      context: containers/indexing-payments/iisa
      dockerfile: Dockerfile.scoring
    depends_on:
      redpanda: { condition: service_healthy }
    environment:
      REDPANDA_BOOTSTRAP_SERVERS: "redpanda:9092"
      REDPANDA_TOPIC: gateway_queries${KAFKA_TOPIC_ENVIRONMENT:+_${KAFKA_TOPIC_ENVIRONMENT}}
      SCORES_FILE_PATH: /app/scores/indexer_scores.json
      IISA_SCORING_INTERVAL: "600"
    volumes:
      - iisa-scores:/app/scores
    healthcheck:
      test: ["CMD", "test", "-f", "/app/scores/indexer_scores.json"]
      interval: 5s
      retries: 10
    restart: on-failure:3

  iisa:
    container_name: iisa
    profiles: [indexing-payments]
    image: ghcr.io/edgeandnode/subgraph-dips-indexer-selection:${IISA_VERSION}
    pull_policy: if_not_present
    depends_on:
      iisa-scoring: { condition: service_healthy }
    ports: ["8080:8080"]
    environment:
      IISA_HOST: "0.0.0.0"
      IISA_PORT: "8080"
      IISA_LOG_LEVEL: INFO
      SCORES_FILE_PATH: /app/scores/indexer_scores.json
    volumes:
      - iisa-scores:/app/scores
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      retries: 10
      start_period: 30s
    restart: on-failure:3

  dipper:
    container_name: dipper
    profiles: [indexing-payments]
    build:
      context: containers/indexing-payments/dipper
      args:
        DIPPER_VERSION: ${DIPPER_VERSION}
    depends_on:
      block-oracle: { condition: service_healthy }
      postgres: { condition: service_healthy }
      gateway: { condition: service_healthy }
      iisa: { condition: service_healthy }
    ports:
      - "${DIPPER_ADMIN_RPC_PORT}:${DIPPER_ADMIN_RPC_PORT}"
      - "${DIPPER_INDEXER_RPC_PORT}:${DIPPER_INDEXER_RPC_PORT}"
    volumes:
      - ./shared:/opt/shared:ro
      - ./.env:/opt/config/.env:ro
      - config-local:/opt/config:ro
    environment:
      RUST_BACKTRACE: full
      RUST_LOG: debug
    healthcheck:
      interval: 5s
      retries: 10
      test:
        [
          "CMD-SHELL",
          "curl -s -X POST -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"method\":\"health\",\"id\":1}' http://localhost:9000/ | grep -q jsonrpc",
        ]
    restart: on-failure:3

  # dipper-cli runs on demand (docker compose run --rm dipper-cli ...), pinned to the
  # same image as the dipper server so they never drift. The `tools` profile keeps it
  # out of `up`; /fresh-deploy pulls it. Key + admin URL come from the env below.
  dipper-cli:
    image: ghcr.io/edgeandnode/dipper-cli:${DIPPER_VERSION}
    profiles: [tools]
    environment:
      INDEXING_SERVER_URL: "http://dipper:${DIPPER_ADMIN_RPC_PORT}/"
      INDEXING_SIGNING_KEY: "${INDEXER_SECRET}"

  # --- Readiness check ---

  ready:
    container_name: ready
    image: busybox:latest
    depends_on:
      start-indexing: { condition: service_completed_successfully }
      gateway: { condition: service_healthy }
    command: echo "Local network ready"

volumes:
  chain-data:
  postgres-data:
  ipfs-data:
  redpanda-data:
  iisa-scores:
  config-local:

# Network shared with per-test indexer compose projects (compose/test-indexer.yaml).
# Only services test stacks must reach (chain, ipfs) attach here; services the test
# stack runs its own copy of stay off it, so the test container's DNS resolves locally.
networks:
  default:
  cross-stack:
    name: cross-stack
