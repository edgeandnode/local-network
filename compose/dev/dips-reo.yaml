# DIPs source mount: eligibility-oracle-node (REO)
#
# Mounts local eligibility-oracle-node checkout and runs `cargo build`
# inside the container.
#
# Activate via COMPOSE_FILE in .env:
#   COMPOSE_FILE=docker-compose.yaml:compose/dev/dips-reo.yaml
#
# Required env vars: REO_SOURCE_ROOT

services:
  eligibility-oracle-node:
    platform: linux/arm64
    build:
      dockerfile_inline: |
        FROM rust:1-slim-bookworm
        RUN apt-get update \
            && apt-get install -y --no-install-recommends \
                build-essential ca-certificates curl git pkg-config libssl-dev \
            && rm -rf /var/lib/apt/lists/*
    entrypoint: ["bash", "/opt/run-reo.sh"]
    volumes:
      - ${REO_SOURCE_ROOT:?Set REO_SOURCE_ROOT to local eligibility-oracle-node checkout}:/opt/source
      - ./containers/oracles/eligibility-oracle-node/run-reo.sh:/opt/run-reo.sh:ro
      - ./containers/shared:/opt/shared:ro
      - ./.env:/opt/config/.env:ro
      - config-local:/opt/config:ro
    environment:
      RUST_LOG: info,eligibility_oracle=debug
      RUST_BACKTRACE: "1"
