# DIPs source mount: iisa (HTTP API + cronjob)
#
# Mounts local subgraph-dips-indexer-selection checkout. The Python service
# runs directly from source, no compile step. Replaces the GHCR image
# defined in the base file.
#
# Activate via COMPOSE_FILE in .env:
#   COMPOSE_FILE=docker-compose.yaml:compose/dev/dips-iisa.yaml
#
# Required env vars: IISA_SOURCE_ROOT

services:
  # Real IISA cronjob from source - runs scoring pipeline with /dips/info fetching
  iisa-cronjob:
    platform: linux/arm64
    build:
      dockerfile_inline: |
        FROM python:3.11-slim
        RUN apt-get update \
            && apt-get install -y --no-install-recommends \
                build-essential gcc curl protobuf-compiler \
            && rm -rf /var/lib/apt/lists/*
        RUN pip install --no-cache-dir uv
    entrypoint: ["bash", "/opt/run-cronjob.sh"]
    volumes:
      - ${IISA_SOURCE_ROOT:?Set IISA_SOURCE_ROOT to local subgraph-dips-indexer-selection checkout}/cronjobs/compute_scores:/opt/source:ro
      - ./containers/indexing-payments/iisa/run-cronjob.sh:/opt/run-cronjob.sh:ro
    environment:
      PYTHONUNBUFFERED: "1"
      REDPANDA_GATEWAY_IDS: "local"

  # Real IISA from source - replaces GHCR image
  iisa:
    profiles: []
    platform: linux/arm64
    image: iisa:local
    pull_policy: never
    build:
      dockerfile_inline: |
        FROM python:3.12-slim
        RUN apt-get update \
            && apt-get install -y --no-install-recommends \
                build-essential gcc curl \
            && rm -rf /var/lib/apt/lists/*
        RUN pip install --no-cache-dir uv
    entrypoint: ["bash", "/opt/run-iisa.sh"]
    depends_on: !override
      postgres: { condition: service_healthy }
      gateway: { condition: service_healthy }
    ports:
      - "8080:8080"
    volumes:
      - ${IISA_SOURCE_ROOT:?Set IISA_SOURCE_ROOT to local subgraph-dips-indexer-selection checkout}:/opt/source
      - ./containers/indexing-payments/iisa/run-iisa.sh:/opt/run-iisa.sh:ro
      - ./.env:/opt/config/.env:ro
      - config-local:/opt/config:ro
      - iisa-cache:/app/scores
    environment:
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 3s
      retries: 100
      start_period: 15s
